name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Check the dependencies against the Expo SDK
        run: npx expo-doctor

      - run: yarn test

      - name: Export the web build
        run: npx expo export --platform web
